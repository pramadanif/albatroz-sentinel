[profile.default]
src = "."
test = "test"
out = "out"
libs = ["contracts/sepolia/lib"]
solc = "0.8.19"
optimizer = true
optimizer_runs = 200

remappings = [
    "openzeppelin/=contracts/sepolia/lib/openzeppelin-contracts/contracts/",
    "forge-std/=contracts/sepolia/lib/forge-std/src/"
]

[profile.sepolia]
src = "contracts/sepolia"
test = "test/sepolia"
out = "out"
libs = ["contracts/sepolia/lib"]
solc = "0.8.19"

[profile.reactive]
src = "reactivelasnacontract"
test = "test/reactive"
out = "out"
libs = ["reactivelasnacontract/lib"]
solc = "0.8.19"

[rpc_endpoints]
sepolia = "https://sepolia.drpc.org"

[fuzz]
runs = 256
max_test_rejects = 65536
